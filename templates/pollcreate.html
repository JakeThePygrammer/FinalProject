{% extends "layout.html" %}
{% block content %}
<form method="POST">
    <label>Poll Name</label>
    <input type="text" name="name" required>

    <label>Description</label>
    <textarea name="description"></textarea>

    <label>Category</label>
    <input type="radio" name="category" value="Entertainment & Media"> Entertainment & Media
    <input type="radio" name="category" value="Lifestyle & Food"> Lifestyle & Food
    <input type="radio" name="category" value="Professional & Tech"> Professional & Tech
    <input type="radio" name="category" value="Social & Opinion"> Social & Opinion
    <input type="radio" name="category" value="Random & Just for Fun"> Random & Just for Fun

    <label>Privacy</label>
    <input type="radio" name="privacy" value="0"> Public
    <input type="radio" name="privacy" value="1"> Private

    <hr>
    <label>Option 1</label>
    <input type="text" name="option1name">

    <label>Option 2</label>
    <input type="text" name="option2name">

    <button type="submit">Create Poll</button>
</form>
{% endblock %}

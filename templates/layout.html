<!doctype html>
<html lang="mk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Voting for you" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="nav">
    <a href="{{ url_for('polls') }}">Home</a>
    {% if session.get('user_id') %}
        <a href="{{ url_for('users_logout') }}">Logout</a>
        <a href="{{ url_for('polls_choose') }}">New poll</a>
        <br>
        <h2>Welcome, {{ session['username'] }}</h2>
    {% else %}
        <a href="{{ url_for('users_login') }}">Login</a>
        <a href="{{ url_for('users_new') }}">Sign Up</a>
    {% endif %}
</nav>

<main class="container">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash-wrap">
        {% for msg in messages %}
        <div class="flash">{{ msg }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
